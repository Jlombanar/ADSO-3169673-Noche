<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link rel="stylesheet" href="./css/contactenos.css">
    <script src="https://kit.fontawesome.com/bdc4e23805.js" crossorigin="anonymous"></script>
</head>

<body>

    <!-- HEADER -->
    <div class="container-header">
        <header>

            <div class="logo">
                <a href="./index.html">JERH</a>
            </div>

            <input type="checkbox" id="menu-toggle" />
            <label for="menu-toggle" class="menu-icon">
                <i class="fa-solid fa-bars"></i>
            </label>

            <nav class="nav">
                <ul>
                    <li><a href="./index.html">Inicio</a></li>
                    <li><a href="./sobremi.html">Sobre Mí</a></li>
                    <li><a href="./skill.html">Skills</a></li>
                    <li><a href="./curriculum.html">Curriculum</a></li>
                    <li><a href="./portafolio.html">Portafolio</a></li>
                    <li><a href="./contactenos.html" class="active">Contacto</a></li>
                </ul>
            </nav>

        </header>
    </div>

    <!-- SECCIÓN CONTACTO -->
    <section class="contact-section">
        <div class="container-section">

            <h2>Contáctame</h2>
            <p class="subtitle">
                Puedes escribirme a través del formulario o visitar mi ubicación.
            </p>

            <div class="contact-grid">

                <!-- FORMULARIO -->
                <div class="contact-card">
                    <form action="#" method="POST">
                        <input type="text" placeholder="Tu nombre" required>
                        <input type="email" placeholder="Tu correo" required>
                        <textarea placeholder="Tu mensaje" required></textarea>
                        <button type="submit">Enviar</button>
                    </form>
                </div>

                <!-- MAPA -->
                <div class="contact-card map-card">
                    <iframe 
                        src="https://www.google.com/maps?q=SENA%20Garzon%20Huila&output=embed"
                        allowfullscreen="" 
                        loading="lazy">
                    </iframe>
                </div>

            </div>

        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>© 2026 JERH — Todos los derechos reservados</p>

            <div class="redes">
                <a href="#"><i class="fa-brands fa-facebook"></i></a>
                <a href="#"><i class="fa-brands fa-twitter"></i></a>
                <a href="#"><i class="fa-brands fa-instagram"></i></a>
                <a href="#"><i class="fa-brands fa-linkedin"></i></a>
            </div>
        </div>
    </footer>

</body>
