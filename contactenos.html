<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="./css/contacto.css">
</head>
<body>

    <header>
        <nav class="nav-container">
            <input type="checkbox" id="menu-check">
            
            <label for="menu-check" class="menu-toggle">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </label>

            <ul class="nav-list">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="sobremi.html">Sobre Mí</a></li>
                <li><a href="curriculum.html">Currículum</a></li>
                <li><a href="skill.html">Skills</a></li>
                <li><a href="protafolio.html">Portafolio</a></li>
                <li><a href="contactenos.html" class="active">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="contact-container">
        <div class="contact-header">
            <span class="subtitle">Ponte en contacto</span>
            <h2>Hablemos</h2>
            <p>¿Tienes un proyecto en mente o alguna consulta? No dudes en escribirme.</p>
        </div>

        <div class="contact-content">
            <div class="contact-info">
                <div class="info-item">
                    <i class="fas fa-envelope"></i>
                    <div>
                        <h3>Email</h3>
                        <p>angaritajuan08@gmail.com</p>
                    </div>
                </div>
                <div class="info-item">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>
                        <h3>Ubicación</h3>
                        <p>Huila, Colombia</p>
                    </div>
                </div>
                <div class="social-links">
                    <a href="https://www.linkedin.com/in/juan-angarita-675552298?utm_source=share&utm_campaign=share_via&utm_content=profile&utm_medium=android_app"><i class="fab fa-linkedin"></i></a>
                    <a href="https://github.com/juanangarita360"><i class="fab fa-github"></i></a>
                    <a href="#"><i class="fab fa-instagram"></i></a>
                </div>
            </div>

            <form class="contact-form" id="form-contacto">
                <div class="input-group">
                    <input type="text" id="nombre" placeholder="Nombre completo" required>
                    <input type="email" id="email" placeholder="Correo electrónico" required>
                </div>
                <input type="text" id="asunto" placeholder="Asunto" required>
                <textarea id="mensaje" placeholder="Tu mensaje..." rows="6" required></textarea>
                <button type="submit" class="btn-submit">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 - Juan David Angarita Rojas</p>
    </footer>

    <script>
        document.getElementById('form-contacto').addEventListener('submit', function(e) {
            e.preventDefault(); // Evita que la página se recargue
            
            
            const telefono = "573238004860"; // NÚMERO
            
            // Captura de datos
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const asunto = document.getElementById('asunto').value;
            const mensaje = document.getElementById('mensaje').value;

            // Formateo del mensaje para WhatsApp
            const textoWhatsApp = `Hola Juan! Mi nombre es ${nombre}.%0A%0A*Asunto:* ${asunto}%0A*Correo:* ${email}%0A*Mensaje:* ${mensaje}`;

            // Crear el enlace final
            const url = `https://api.whatsapp.com/send?phone=${telefono}&text=${textoWhatsApp}`;

            // Redireccionar
            window.open(url, '_blank');
        });
    </script>

</body>
</html>
