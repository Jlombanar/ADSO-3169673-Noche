<header class="navbar">
  <div class="logo">
    <a href="#">C<span>S</span>L</a>
  </div>

  <input type="checkbox" id="menu-toggle" class="menu-check">

  <label for="menu-toggle" class="menu-icon">

<main class="contact-main">

  <section class="contact-container">
    <h2>Contáctame</h2>
    <p>¿Tienes un proyecto o una idea? Hablemos 👇</p>

    <form class="contact-form">
      <div class="input-group">
        <input type="text" placeholder="Tu nombre" required>
      </div>

      <div class="input-group">
        <input type="email" placeholder="Tu correo electrónico" required>
      </div>

      <div class="input-group">
        <textarea rows="5" placeholder="Escribe tu mensaje..." required></textarea>
      </div>

      <button type="submit" class="btn-submit">Enviar Mensaje</button>
    </form>
  </section>

  <section class="map-section">
    <h3>Ubicación</h3>
    <div class="map-wrapper">
      <iframe 
        src="https://www.google.com/maps?q=Garzón,Huila&output=embed"
        loading="lazy">
      </iframe>
    </div>
  </section>

</main>
