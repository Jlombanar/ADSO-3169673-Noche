<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto - Sofía Durán</title>
  <link rel="stylesheet" href="./css/contactenos.css">
  <script src="https://kit.fontawesome.com/bdc4e23805.js" crossorigin="anonymous"></script>
</head>
<body>

  <img src="./img/fondo-inicio.png" class="fondo-inicio" alt="Imagen de fondo">

  <header class="header">
    <div class="logo">
      <a href="./index.html">Sofía Durán</a>
    </div>
    <input type="checkbox" id="menu-toggle">
    <label for="menu-toggle" class="menu-icon">
      <i class="fa-solid fa-bars"></i>
    </label>

    <nav class="nav">
      <ul>
        <li><a href="./index.html">Inicio</a></li>
        <li><a href="./sobremi.html">Sobre Mí</a></li>
        <li><a href="./skill.html">Skill</a></li>
        <li><a href="./curriculum.html">Currículum</a></li>
        <li><a href="./protafolio.html">Portafolio</a></li>
        <li><a href="./contactenos.html" class="active">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <section class="contact">
    <div class="contact-container">
      <h1>Contáctame</h1>
      <p class="subtitle">Puedes escribirme a través del formulario o visitarme en mi ubicación.</p>
      <div class="contact-content">

        <div class="contact-form">
          <form action="#" method="post">
            <input type="text" name="nombre" placeholder="Tu nombre" required>
            <input type="email" name="correo" placeholder="Tu correo" required>
            <textarea name="mensaje" rows="6" placeholder="Tu mensaje" required></textarea>
            <button type="submit">Enviar</button>
          </form>
        </div>

        <div class="contact-map">
          <iframe 
            src="https://www.google.com/maps?q=Calle+3+Las+Mercedes+Garz%C3%B3n+Huila+Colombia&output=embed"
            width="100%" 
            height="100%" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
          </iframe>
        </div>

      </div>
    </div>
  </section>

   <footer class="footer">
    <div class="footer-container">
      <p>Conectemos en redes sociales</p>
      <div class="social-links">
        <a href="#"><i class="fa-brands fa-facebook"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin"></i></a>
      </div>
    </div>
  </footer>


</body>
</html>
