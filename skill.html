<script>
const progresos = document.querySelectorAll('.progreso');

function animarBarras(){
  progresos.forEach(barra => {
    const porcentaje = barra.getAttribute('data-width');
    barra.style.width = porcentaje;
  });
}

window.addEventListener('load', animarBarras);
</script>
